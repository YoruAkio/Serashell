anchor=top-right
outer-margin=20
margin=10
width=380
height=180
padding=14
border-size=2
border-radius=14
font=SF Pro Display Medium 11
background-color=#352B2DF2
text-color=#F1DBC2
border-color=#4B3D43
progress-color=over #CCB7A0
icons=1
max-icon-size=64
icon-location=left
markup=1
format=<b>%s</b>\n%b
text-alignment=left
default-timeout=7000
max-visible=4
history=1
actions=1
on-button-left=invoke-default-action
on-button-middle=dismiss
on-button-right=dismiss

[urgency=low]
background-color=#44373AF2
text-color=#DFC8B1
border-color=#908A7B
default-timeout=4000

[urgency=normal]
background-color=#352B2DF2
text-color=#F1DBC2
border-color=#4B3D43

[urgency=high]
background-color=#352B2D
text-color=#F1DBC2
border-color=#CCB7A0
default-timeout=0
