set -g mouse on
set -g allow-passthrough on
set-option -g status-position top
bind-key -n M-r source-file ~/.tmux.conf \; display-message "config reloaded"
set -g extended-keys on
set -g extended-keys-format csi-u

bind-key -n M-0 select-window -t 0
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9

set -g base-index 1
setw -g pane-base-index 1
set-option -g renumber-windows on
set -g status-interval 5
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 60
set -g window-status-separator " "

if-shell '[ "$(cat ~/.config/quickshell/theme-mode 2>/dev/null)" = "light" ]' 'set -g status-style "bg=#F1DBC2,fg=#625458"' 'set -g status-style "bg=#352B2D,fg=#AA9D8A"'
if-shell '[ "$(cat ~/.config/quickshell/theme-mode 2>/dev/null)" = "light" ]' 'set -g status-left "#[fg=#4B3D43,bg=#F1DBC2]#[fg=#F1DBC2,bg=#4B3D43,bold] #[bg=#DFC8B1,fg=#352B2D,bold] #S#[fg=#DFC8B1,bg=#F1DBC2] "' 'set -g status-left "#[fg=#CCB7A0,bg=#352B2D]#[fg=#352B2D,bg=#CCB7A0,bold] #[bg=#44373A,fg=#F1DBC2,bold] #S#[fg=#44373A,bg=#352B2D] "'
if-shell '[ "$(cat ~/.config/quickshell/theme-mode 2>/dev/null)" = "light" ]' 'set -g status-right "#[fg=#4B3D43,bg=#F1DBC2]#[fg=#F1DBC2,bg=#4B3D43,bold] #[bg=#DFC8B1,fg=#352B2D] %a %d %b #[fg=#4B3D43]· #[fg=#352B2D,bold]%H:%M #[fg=#DFC8B1,bg=#F1DBC2] "' 'set -g status-right "#[fg=#CCB7A0,bg=#352B2D]#[fg=#352B2D,bg=#CCB7A0,bold] #[bg=#44373A,fg=#F1DBC2] %a %d %b #[fg=#CCB7A0]· #[fg=#F1DBC2,bold]%H:%M #[fg=#44373A,bg=#352B2D] "'
if-shell '[ "$(cat ~/.config/quickshell/theme-mode 2>/dev/null)" = "light" ]' 'set -g window-status-format "#[fg=#857974,bg=#F1DBC2]#[fg=#F1DBC2,bg=#857974,bold]#I #[bg=#DFC8B1,fg=#625458] #W#[fg=#DFC8B1,bg=#F1DBC2]"' 'set -g window-status-format "#[fg=#908A7B,bg=#352B2D]#[fg=#352B2D,bg=#908A7B,bold]#I #[bg=#44373A,fg=#AA9D8A] #W#[fg=#44373A,bg=#352B2D]"'
if-shell '[ "$(cat ~/.config/quickshell/theme-mode 2>/dev/null)" = "light" ]' 'set -g window-status-current-format "#[fg=#4B3D43,bg=#F1DBC2]#[fg=#F1DBC2,bg=#4B3D43,bold]#I #[bg=#DFC8B1,fg=#352B2D,bold] #W#[fg=#DFC8B1,bg=#F1DBC2]"' 'set -g window-status-current-format "#[fg=#CCB7A0,bg=#352B2D]#[fg=#352B2D,bg=#CCB7A0,bold]#I #[bg=#44373A,fg=#F1DBC2,bold] #W#[fg=#44373A,bg=#352B2D]"'
if-shell '[ "$(cat ~/.config/quickshell/theme-mode 2>/dev/null)" = "light" ]' 'set -g pane-border-style "fg=#DFC8B1"; set -g pane-active-border-style "fg=#4B3D43"; set -g message-style "bg=#F1DBC2,fg=#4B3D43"; set -g mode-style "bg=#4B3D43,fg=#F1DBC2"' 'set -g pane-border-style "fg=#44373A"; set -g pane-active-border-style "fg=#CCB7A0"; set -g message-style "bg=#352B2D,fg=#CCB7A0"; set -g mode-style "bg=#CCB7A0,fg=#352B2D"'
