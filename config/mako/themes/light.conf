anchor=top-right
outer-margin=20
margin=10
width=380
height=180
padding=14
border-size=2
border-radius=14
font=SF Pro Display Medium 11
background-color=#F1DBC2F2
text-color=#352B2D
border-color=#CCB7A0
progress-color=over #4B3D43
icons=1
max-icon-size=64
icon-location=left
markup=1
format=<b>%s</b>\n%b
text-alignment=left
default-timeout=7000
max-visible=4
history=1
actions=1
on-button-left=invoke-default-action
on-button-middle=dismiss
on-button-right=dismiss

[urgency=low]
background-color=#DFC8B1F2
text-color=#44373A
border-color=#857974
default-timeout=4000

[urgency=normal]
background-color=#F1DBC2F2
text-color=#352B2D
border-color=#CCB7A0

[urgency=high]
background-color=#F1DBC2
text-color=#352B2D
border-color=#4B3D43
default-timeout=0
